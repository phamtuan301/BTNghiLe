<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo List</title>
</head>
<body>

<h2>Danh sách Task</h2>

<div th:if="${message}" style="color: green">
    <p th:text="${message}"></p>
</div>

<a th:href="@{/todos/create}">+ Thêm mới</a>

<table border="1" cellpadding="10">
    <tr>
        <th>ID</th>
        <th>Nội dung</th>
        <th>Hạn</th>
        <th>Trạng thái</th>
        <th>Ưu tiên</th>
        <th>Hành động</th>
    </tr>

    <tr th:each="todo : ${todos}">
        <td th:text="${todo.id}"></td>
        <td th:text="${todo.content}"></td>
        <td th:text="${todo.dueDate}"></td>
        <td th:text="${todo.status}"></td>
        <td th:text="${todo.priority}"></td>
        <td>
            <a th:href="@{/todos/edit/{id}(id=${todo.id})}">Sửa</a>

            <a th:href="@{/todos/delete/{id}(id=${todo.id})}"
               onclick="return confirm('Bạn chắc chắn muốn xóa?')">
                Xóa
            </a>
        </td>
    </tr>
</table>

</body>
</html>
