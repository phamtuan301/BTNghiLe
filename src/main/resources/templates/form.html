<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo Form</title>
</head>
<body>

<h2 th:text="${todo.id == null ? 'Thêm Task' : 'Cập nhật Task'}"></h2>

<form th:action="@{/todos/save}" th:object="${todo}" method="post">

    <!-- BẮT BUỘC -->
    <input type="hidden" th:field="*{id}">

    <div>
        Nội dung:
        <input type="text" th:field="*{content}">
        <span style="color:red" th:errors="*{content}"></span>
    </div>

    <div>
        Hạn:
        <input type="date" th:field="*{dueDate}">
        <span style="color:red" th:errors="*{dueDate}"></span>
    </div>

    <div>
        Trạng thái:
        <select th:field="*{status}">
            <option value="Pending">Pending</option>
            <option value="Done">Done</option>
        </select>
    </div>

    <div>
        Ưu tiên:
        <select th:field="*{priority}">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>

    <button type="submit">Lưu</button>
</form>

</body>
</html>
