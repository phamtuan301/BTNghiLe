<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Todo Form</title>
</head>
<body>

<a href="?lang=vi">VI</a> |
<a href="?lang=en">EN</a>

<h2 th:text="${todo.id == null ? #messages.msgOrNull('add.new') : #messages.msgOrNull('edit')}"></h2>

<form th:action="@{/todos/save}" th:object="${todo}" method="post">

    <input type="hidden" th:field="*{id}">

    <div>
        <label th:text="#{content}"></label>
        <input type="text" th:field="*{content}">
        <span style="color:red" th:errors="*{content}"></span>
    </div>

    <div>
        <label th:text="#{dueDate}"></label>
        <input type="date" th:field="*{dueDate}">
        <span style="color:red" th:errors="*{dueDate}"></span>
    </div>

    <div>
        <label th:text="#{status}"></label>
        <select th:field="*{status}">
            <option value="Pending">Pending</option>
            <option value="Done">Done</option>
        </select>
    </div>

    <div>
        <label th:text="#{priority}"></label>
        <select th:field="*{priority}">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>

    <button type="submit" th:text="#{save}"></button>

</form>

</body>
</html>
